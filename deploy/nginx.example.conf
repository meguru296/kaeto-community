# Replace gal.example.com and certificate paths. Enable only after HTTPS is ready.
server {
    listen 80;
    server_name gal.example.com;
    return 301 https://gal.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name gal.example.com;
    ssl_certificate /etc/letsencrypt/live/gal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    client_body_timeout 15s;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
    }
    # Source, runtime data and mail configuration never have a public route.
    location ~ ^/(data|src|scripts|tools|deploy|node_modules)/ { return 404; }
    location ~ (^|/)\. { return 404; }
}
